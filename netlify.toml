# Netlify configuration – BSIndia Bank (demo)
[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set SITE_URL in Netlify → Site settings → Environment variables to your final domain
  # SITE_URL = "https://www.example.com"

[[redirects]]
  from = "/net-banking"
  to = "/personal/digital-banking/"
  status = 301
[[redirects]]
  from = "/home-loan"
  to = "/personal/home-loan/"
  status = 301
[[redirects]]
  from = "/fd"
  to = "/personal/fixed-deposit/"
  status = 301
[[redirects]]
  from = "/nri-banking"
  to = "/nri/"
  status = 301
[[redirects]]
  from = "/grievance"
  to = "/customer-care/grievance-redressal/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
